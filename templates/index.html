<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手寫辨識系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+TC:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f0f0f8;
            --surface: #ffffff;
            --surface2: #f5f4fb;
            --border: #e0deee;
            --accent: #6c47f5;
            --accent-light: #ede9fe;
            --accent2: #a855f7;
            --glow: #6c47f522;
            --text: #18182a;
            --text-muted: #7b78a0;
            --success: #16a34a;
            --success-bg: #f0fdf4;
            --error: #dc2626;
            --error-bg: #fef2f2;
            --canvas-bg: #0d0d14;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
        }

        /* Subtle dot grid */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, #c4bfe870 1px, transparent 1px);
            background-size: 28px 28px;
            pointer-events: none;
            z-index: 0;
        }

        /* Top shimmer bar */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
            background-size: 200%;
            animation: shimmer 4s linear infinite;
            z-index: 100;
        }

        @keyframes shimmer {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.75); }
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pop {
            0% { transform: scale(0.7); opacity: 0; }
            65% { transform: scale(1.12); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ── Layout ── */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 560px;
            padding: 20px 16px 40px;
        }

        @media (min-width: 960px) {
            .container { max-width: 1020px; padding: 48px 32px 64px; }
        }

        /* ── Header ── */
        .header {
            text-align: center;
            margin-bottom: 24px;
            animation: fadeDown 0.5s ease both;
        }

        @media (min-width: 960px) { .header { margin-bottom: 40px; } }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent-light);
            color: var(--accent);
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 5px 16px;
            border-radius: 100px;
            margin-bottom: 14px;
            border: 1px solid #cdc5fd;
        }

        .badge-dot {
            width: 6px; height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        h1 {
            font-size: 36px;
            font-weight: 900;
            color: var(--text);
            letter-spacing: -1.5px;
            line-height: 1.1;
        }

        h1 .grad {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 8px;
            font-weight: 300;
        }

        @media (min-width: 960px) {
            h1 { font-size: 52px; letter-spacing: -2px; }
            .subtitle { font-size: 16px; margin-top: 10px; }
        }

        /* ── Card ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 40px rgba(108,71,245,0.07), 0 1px 4px rgba(0,0,0,0.04);
            animation: fadeUp 0.5s ease 0.1s both;
        }

        @media (min-width: 600px) { .card { padding: 28px; border-radius: 24px; } }
        @media (min-width: 960px) { .card { padding: 40px; border-radius: 28px; } }

        .card-inner {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        @media (min-width: 960px) {
            .card-inner {
                flex-direction: row;
                gap: 0;
                align-items: stretch;
            }

            .canvas-col {
                flex: 0 0 440px;
                padding-right: 44px;
                border-right: 1px solid var(--border);
            }

            .right-col {
                flex: 1;
                padding-left: 44px;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                gap: 28px;
            }
        }

        /* ── Canvas ── */
        .canvas-label {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .canvas-wrapper {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 20px rgba(0,0,0,0.14), 0 0 0 1.5px rgba(255,255,255,0.04);
            transition: box-shadow 0.25s;
        }

        .canvas-wrapper.drawing,
        .canvas-wrapper:hover {
            box-shadow: 0 4px 36px rgba(108,71,245,0.25), 0 0 0 2.5px var(--accent);
        }

        #drawCanvas {
            display: block;
            width: 100%;
            aspect-ratio: 1;
            background: var(--canvas-bg);
            cursor: crosshair;
            border-radius: 14px;
        }

        .canvas-hint {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .canvas-hint.hidden { opacity: 0; }

        .canvas-hint-inner {
            text-align: center;
            color: rgba(255,255,255,0.14);
        }

        .canvas-hint-inner svg { display: block; margin: 0 auto 10px; }
        .canvas-hint-inner p { font-size: 12px; letter-spacing: 1.5px; font-family: 'Space Mono', monospace; }

        /* ── Right col ── */
        .desc-block {
            padding: 16px 18px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 14px;
        }

        .desc-title {
            font-size: 11px;
            font-family: 'Space Mono', monospace;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .desc-block p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.75;
        }

        @media (min-width: 960px) {
            .desc-block { padding: 20px 24px; }
            .desc-block p { font-size: 15px; }
        }

        /* ── Buttons ── */
        .btn-row {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 12px;
        }

        .btn {
            height: 52px;
            padding: 0 20px;
            border-radius: 13px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Noto Sans TC', sans-serif;
            border: none;
            cursor: pointer;
            transition: all 0.18s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            white-space: nowrap;
        }

        @media (min-width: 960px) {
            .btn { height: 60px; font-size: 16px; border-radius: 14px; }
        }

        .btn-clear {
            background: var(--surface2);
            color: var(--text-muted);
            border: 1.5px solid var(--border);
        }

        .btn-clear:hover { background: #eceaf7; color: var(--text); border-color: #cdc5fd; }
        .btn-clear:active { transform: scale(0.97); }

        .btn-predict {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            box-shadow: 0 4px 20px var(--glow), 0 1px 4px rgba(108,71,245,0.25);
        }

        .btn-predict:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(108,71,245,0.3); }
        .btn-predict:active { transform: scale(0.98) translateY(0); }
        .btn-predict.loading { pointer-events: none; opacity: 0.8; }
        .btn-predict.loading .btn-text { display: none; }
        .btn-predict.loading .btn-loader { display: flex; }

        .btn-loader { display: none; align-items: center; gap: 8px; }

        .spinner {
            width: 17px; height: 17px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Result ── */
        .result-section {
            background: var(--surface2);
            border: 1.5px solid var(--border);
            border-radius: 16px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            min-height: 100px;
            transition: border-color 0.3s, background 0.3s;
        }

        .result-section.success { background: var(--success-bg); border-color: #86efac; }
        .result-section.error-state { background: var(--error-bg); border-color: #fca5a5; }

        @media (min-width: 960px) {
            .result-section { padding: 28px 32px; min-height: 130px; gap: 28px; }
        }

        .result-char {
            font-family: 'Space Mono', monospace;
            font-size: 64px;
            font-weight: 700;
            line-height: 1;
            min-width: 78px;
            text-align: center;
            color: #ccc;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        @media (min-width: 960px) { .result-char { font-size: 88px; min-width: 108px; } }

        .result-char.has-result {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .result-char.error-char { color: var(--error); }
        .result-char.pop { animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

        .result-divider {
            width: 1px; height: 60px;
            background: var(--border);
            flex-shrink: 0;
        }

        @media (min-width: 960px) { .result-divider { height: 80px; } }

        .result-label {
            font-size: 10px;
            font-family: 'Space Mono', monospace;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .result-status {
            font-size: 14px;
            color: var(--text-muted);
            transition: color 0.3s;
            line-height: 1.55;
        }

        @media (min-width: 960px) { .result-status { font-size: 16px; } }

        .result-status.success { color: var(--success); font-weight: 700; }
        .result-status.error { color: var(--error); }
        .result-status.loading { color: var(--accent); }

        /* ── Tips ── */
        .tips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        @media (max-width: 959px) { .tips { justify-content: center; } }

        .tip-tag {
            font-size: 11px;
            font-family: 'Space Mono', monospace;
            padding: 5px 13px;
            background: var(--accent-light);
            border: 1px solid #cdc5fd;
            border-radius: 100px;
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- Header -->
        <div class="header">
            <div class="header-badge">
                <span class="badge-dot"></span>
                AI 辨識系統
            </div>
            <h1>手寫<span class="grad">辨識</span></h1>
            <p class="subtitle">支援數字 0–9 與大寫字母 A–Z，畫完即可辨識</p>
        </div>

        <!-- Card -->
        <div class="card">
            <div class="card-inner">

                <!-- Left: Canvas -->
                <div class="canvas-col">
                    <div class="canvas-label">
                        <span class="badge-dot"></span>
                        繪圖區域
                    </div>
                    <div class="canvas-wrapper" id="canvasWrapper">
                        <canvas id="drawCanvas" width="560" height="560"></canvas>
                        <div class="canvas-hint" id="canvasHint">
                            <div class="canvas-hint-inner">
                                <svg width="44" height="44" fill="none" viewBox="0 0 24 24" stroke="rgba(255,255,255,0.2)" stroke-width="1.2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536M9 13l6.586-6.586a2 2 0 112.828 2.828L11.828 15.828a4 4 0 01-1.697.98l-3.131.876.876-3.131a4 4 0 01.98-1.697z"/>
                                </svg>
                                <p>在此書寫</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right: Controls -->
                <div class="right-col">

                    <div class="desc-block">
                        <div class="desc-title">使用說明</div>
                        <p>在左側黑色畫布書寫數字或大寫英文字母，完成後點擊「開始辨識」，AI 將即時分析您的筆跡並回傳結果。</p>
                    </div>

                    <div class="btn-row">
                        <button class="btn btn-clear" id="clearBtn">
                            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            清除
                        </button>
                        <button class="btn btn-predict" id="predictBtn">
                            <span class="btn-text">✦ 開始辨識</span>
                            <span class="btn-loader">
                                <span class="spinner"></span>
                                辨識中...
                            </span>
                        </button>
                    </div>

                    <div class="result-section" id="resultSection">
                        <div class="result-char" id="resultChar">?</div>
                        <div class="result-divider"></div>
                        <div>
                            <div class="result-label">辨識結果</div>
                            <div class="result-status" id="resultStatus">請在畫布書寫後點擊辨識</div>
                        </div>
                    </div>

                    <div class="tips">
                        <span class="tip-tag">📐 寫大一點</span>
                        <span class="tip-tag">✏️ 支援觸控</span>
                        <span class="tip-tag">⌫ 可清除重寫</span>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        const clearBtn = document.getElementById('clearBtn');
        const predictBtn = document.getElementById('predictBtn');
        const resultChar = document.getElementById('resultChar');
        const resultStatus = document.getElementById('resultStatus');
        const resultSection = document.getElementById('resultSection');
        const canvasWrapper = document.getElementById('canvasWrapper');
        const canvasHint = document.getElementById('canvasHint');

        const API_URL = '/predict';
        let isDrawing = false;
        let hasDrawn = false;

        function initCanvas() {
            ctx.fillStyle = '#0d0d14';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 40;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            resultChar.textContent = '?';
            resultChar.className = 'result-char';
            resultStatus.textContent = '請在畫布書寫後點擊辨識';
            resultStatus.className = 'result-status';
            resultSection.className = 'result-section';
            hasDrawn = false;
            canvasHint.classList.remove('hidden');
        }

        initCanvas();

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const src = e.touches ? e.touches[0] : e;
            return {
                x: (src.clientX - rect.left) * scaleX,
                y: (src.clientY - rect.top) * scaleY
            };
        }

        const startDrawing = (e) => {
            isDrawing = true;
            canvasWrapper.classList.add('drawing');
            if (!hasDrawn) {
                hasDrawn = true;
                canvasHint.classList.add('hidden');
            }
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            e.preventDefault();
        };

        const draw = (e) => {
            if (!isDrawing) return;
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            e.preventDefault();
        };

        const stopDrawing = () => {
            isDrawing = false;
            canvasWrapper.classList.remove('drawing');
            ctx.closePath();
        };

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        clearBtn.addEventListener('click', initCanvas);

        predictBtn.addEventListener('click', async () => {
            predictBtn.classList.add('loading');
            resultStatus.textContent = '正在傳送至後端辨識...';
            resultStatus.className = 'result-status loading';
            resultChar.textContent = '…';
            resultChar.className = 'result-char';
            resultSection.className = 'result-section';

            const base64Image = canvas.toDataURL('image/png');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Image })
                });

                const data = await response.json();

                if (data.success) {
                    resultChar.textContent = data.prediction;
                    resultChar.className = 'result-char has-result pop';
                    resultStatus.textContent = '辨識完成！';
                    resultStatus.className = 'result-status success';
                    resultSection.className = 'result-section success';
                } else {
                    resultChar.textContent = '✕';
                    resultChar.className = 'result-char error-char pop';
                    resultStatus.textContent = '後端錯誤：' + data.error;
                    resultStatus.className = 'result-status error';
                    resultSection.className = 'result-section error-state';
                }
            } catch (err) {
                resultChar.textContent = '!';
                resultChar.className = 'result-char error-char pop';
                resultStatus.textContent = '無法連線至伺服器，請確認 Flask 已啟動';
                resultStatus.className = 'result-status error';
                resultSection.className = 'result-section error-state';
                console.error(err);
            } finally {
                predictBtn.classList.remove('loading');
            }
        });
    </script>
</body>
</html>
